services:
  - type: web
    name: agrifleet-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: agrifleet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agrifleet-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: agrifleet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agrifleet-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: agrifleet-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 168h
      - key: REDIS_HOST
        value: localhost
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: agrifleet-db
    plan: free
    databaseName: agrifleet
    user: agrifleet
